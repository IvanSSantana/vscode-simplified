<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Web Code</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="highlight_sintax.css">
    <script src="https://kit.fontawesome.com/84cef182a4.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
    <header>
        <img src="logo.svg" alt="Logo" class="Vlower">
        <button id="arquivo">Arquivo</button>
        <button id="editar">Editar</button>

        <input type="text" value="nome-arquivo">
    </header>

    <main>
        <aside>
            <div class="botoes-aba-lateral">
                <i class="fa-regular fa-file" id="botao-lateral-arquivo"></i>
                <i class="fa-solid fa-magnifying-glass" id="botao-lateral-pesquisa"></i>
                <button id="play-codigo" style="color: white; background-color: transparent;"><i class="fa-regular fa-circle-play"></i></button>
            </div>

            <!-- Não vai vir com essa classe por padrão. Virá com JS que removerá o 'display: none' também -->
            <div id="aba-lateral" style="display: none"></div>
        </aside>

        <section class="area-codigo">
            <section class="abas-arquivos"></section>

            <section class="editor">
                <iframe id="codigo-preview"></iframe>
                <pre id="codigo-render"></pre>
                <textarea id="codigo"></textarea>
            </section>
        </section>
    </main>
    
    <dialog id="opcoes-aba-arquivo" class="opcoes-aba" style="display: none;">
        <button option="novo-arquivo" class="novoarquivo">Novo Arquivo <p class="atalho-abas-superiores-novo-arquivo" >Shift + N</p></button>

        <div class="botao-selecionar-arquivo">
            <button option="abrir-arquivo">Abrir Arquivo</button>
            <input option="abrir-arquivo" type="file" accept=".html, .txt" style="opacity: 0;" id="input-arquivo">
        </div>
        
        <button option="salvar">Salvar <p class="atalho-abas-superiores-salvar">Ctrl + Shift + S</p></button>
    </dialog>

    <dialog id="opcoes-aba-editar" class="opcoes-aba" style="display: none;">
        <button option="novo-arquivo">Localizar</button>
        <button option="abrir-arquivo">Substituir</button>
    </dialog>

    <dialog id="input-nome-arquivo" style="display: none;">
        <input type="text" placeholder="Digite o nome do arquivo..." class="texto-input">
    </dialog>

    <script type="module" src="arquivo.js"></script>
    <script type="module" src="listeners.js"></script>
        
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</body>
</html>
