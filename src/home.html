<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vlower Code Editor</title>
    <link rel="stylesheet" href="home.css">
    <script src="https://kit.fontawesome.com/84cef182a4.js" crossorigin="anonymous"></script>
</head>
<body>
     <header>
    
    </header>

    <main>
        <aside></aside>
        <img src="img/Vlower2.png" class="Vlowerzinho">
        <img src="img/titulo.png" alt="titulo" class="titulo">

        <section id="botoes">
            <button>
                <a id="novo-arquivo" href="index.html"> 
                    <span>Novo arquivo</span>
                    <i class="fa-regular fa-file"></i>
                </a>
            </button>
            
            <button id="abrir-arquivo">
                <label for="input-arquivo">
                    <span>Importar Arquivo</span>
                    <i class="fa-regular fa-folder"></i>
                </label>
                
                <input id="input-arquivo" type="file" accept=".html,.txt" hidden>
            </button>

        </section>
    </main>

    <script src="home.js"></script>
</body>
</html>
